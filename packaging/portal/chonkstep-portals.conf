# Portal backend selection for a chonkstep session.
#
# xdg-desktop-portal picks this file when $XDG_CURRENT_DESKTOP contains
# "chonkstep" (matched case-insensitively against the file's name), which
# scripts/wayland-session.sh exports and scripts/install.sh writes into
# the session's .desktop entry as DesktopNames. Installed by
# scripts/install.sh to /usr/share/xdg-desktop-portal/ — a user override
# can live at ~/.config/xdg-desktop-portal/chonkstep-portals.conf.
#
# ScreenCast and Screenshot go to xdg-desktop-portal-wlr: it speaks only
# wlr-protocols (zwlr_screencopy_manager_v1, xdg-output), both of which
# chonkstep-wayland advertises, so screen sharing in a browser call and
# portal screenshots work against this compositor even though it is not
# wlroots. Everything else — file chooser, notifications, settings —
# falls back to the GTK backend, which is toolkit-generic and present on
# essentially any desktop install.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
