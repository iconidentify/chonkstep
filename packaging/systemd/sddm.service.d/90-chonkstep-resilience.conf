# ChonkStep's managed Wayland session needs time to return DRM master and the
# VT before SDDM starts its next display server. Omarchy's vendor unit allows
# only five seconds, then permanently latches off after two quick failures.
[Unit]
StartLimitIntervalSec=0
StartLimitBurst=10

[Service]
TimeoutStopSec=20s
RestartSec=3s
