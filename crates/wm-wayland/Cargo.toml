[package]
name = "wm-wayland"
description = "Wayland compositor backend for chonkstep, built on Smithay"
version.workspace = true
edition.workspace = true
license.workspace = true

# Linux-only by nature: on other hosts this crate compiles to an empty
# library (see lib.rs's cfg gate) so the whole workspace still builds
# and tests on a macOS dev machine.
[target.'cfg(target_os = "linux")'.dependencies]
wm-core = { path = "../wm-core" }
wm-theme = { path = "../wm-theme" }
wm-theme-api = { path = "../wm-theme-api" }
wm-config = { path = "../wm-config" }
chonk-shell = { path = "../chonk-shell" }
# The Hyprland IPC protocol, so Omarchy's unmodified shell and the real
# `hyprctl` binary work against chonkstep. Deliberately a separate crate
# with no dependency on `wm-core`: every JSON shape and parser in it is
# a promise made to somebody else's binary, and keeping it free of the
# window manager is what lets those promises be tested without booting
# one. This crate supplies the other half — the live state to serve and
# the place in the event loop. See `crates/wm-wayland/src/hyprland_ipc.rs`.
chonk-hyprland-ipc = { path = "../chonk-hyprland-ipc" }
# XSETTINGS publishing for XWayland clients. The compositor opens a
# second, ordinary X11 connection to Xwayland for this — see
# `Compositor::xsettings` — because that is the only channel a toolkit
# will listen to for a *live* scale change, and the only one that
# reaches an application the desktop's own launcher did not spawn.
# Depended on unconditionally rather than behind the `xwayland` feature
# gate: the crate is a few hundred lines of x11rb with no system
# libraries of its own, and a build where it were absent would silently
# be a build where terminal-launched GTK apps render at 1x.
chonk-xsettings = { path = "../chonk-xsettings" }
# EWMH publishing to the XWayland root (see `xewmh.rs`) — a third
# ordinary X11 client connection beside smithay's XWM and the
# XSETTINGS manager's, because smithay exposes no property-write
# access to its own. Pinned to the same "0.13" requirement `wm-x11`
# and `chonk-xsettings` use so the workspace resolves one copy.
x11rb = "0.13"
tracing = "0.1"
# Screenshot encoding (see `capture.rs`) - the same rasterizer the
# theme engine draws with, so no second image stack enters the graph.
tiny-skia = "0.11"
# Protocol code generation for the one interface no published crate
# carries: `hyprland-focus-grab-v1` (see `focus_grab.rs` and the XML
# vendored beside it in `protocols/`). Omarchy's Quickshell desktop
# uses it for click-outside-to-dismiss on every popup it opens, and a
# compositor without it makes that shell's bar popouts, notification
# cards and menus impossible to close by clicking away.
#
# This costs no new crate in the dependency graph: `wayland-scanner` is
# already compiled here as the code generator behind
# `wayland-protocols`, `wayland-protocols-wlr` and `wayland-server`
# itself, and it is a proc-macro crate — `generate_server_code!` runs at
# expansion time, so there is no `build.rs` and no generated file to
# check in and let drift. Pinned to the same "0.31" requirement those
# crates use so the workspace resolves one copy.
wayland-scanner = "0.31"

# Smithay 0.7 is the pinned compositor framework. Features are opted
# into explicitly (default-features = false); both backends — the
# nested winit one and the real DRM/KMS session — are compiled in on
# Linux, and which one runs is decided at startup by
# `state::run` (see `Graphics`), not at build time. That is deliberate:
# one binary has to serve both "I am logging into chonkstep from a TTY"
# and "I am previewing it inside my existing desktop", and a build-time
# split would mean shipping two.
#
# - backend_winit: the nested development backend (the compositor runs
#   inside a window on an existing desktop), which also pulls in
#   backend_egl and the winit/wayland-client plumbing it needs.
# - renderer_gl: the GLES2 renderer every render element in
#   `renderer.rs` is typed against.
# - desktop: `PopupManager` and the surface-tree helpers
#   (`send_frames_surface_tree`) — we deliberately do NOT use its
#   `Space`, since `wm-core` owns geometry and stacking, but the
#   utilities are shared.
# - wayland_frontend: the wayland-server protocol machinery (pure-Rust
#   wayland-backend; `use_system_lib` stays OFF on purpose so no
#   system libwayland is required to build).
# - xwayland: XWayland process management plus the X11 window-manager
#   connection (X11Wm/XwmHandler), so X11 apps run under the
#   compositor unchanged.
#
# Keysyms and modifier state come through Smithay's own xkbcommon
# re-exports (`smithay::input::keyboard::{Keysym, ModifiersState}`), so
# no direct xkbcommon dependency is needed.
# The session half needs system libraries at build and run time -
# libdrm, libgbm, EGL, libinput, libudev, libseat - which every
# graphical Linux system already carries and `scripts/install.sh`
# installs explicitly:
#
# - backend_drm + backend_gbm + backend_egl: mode setting on the DRM
#   device, buffer allocation through GBM, and the EGL context the
#   GLES renderer draws into.
# - backend_libinput + backend_udev: real keyboards, mice, and
#   touchpads, discovered and hot-plugged through udev.
# - backend_session_libseat: seat management, so the compositor opens
#   DRM and input devices without being root and hands them back
#   across VT switches.
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "desktop",
    "wayland_frontend",
    "xwayland",
] }
