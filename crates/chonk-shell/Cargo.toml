[package]
name = "chonk-shell"
description = "The chonkstep desktop shell, backend-generic: dock, Clip, menus, launcher, instruments"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chonk-dock-proto = { path = "../chonk-dock-proto" }
chonk-dock-widget = { path = "../chonk-dock-widget" }
# The six built-in instruments. The edge points this way and only this
# way: `chonk-instruments` cannot see this crate, which is what makes
# its per-crate ban on file, process and thread APIs meaningful — there
# is nothing there to reach for, not merely a lint saying not to.
chonk-instruments = { path = "../chonk-instruments" }
wm-core = { path = "../wm-core" }
wm-theme = { path = "../wm-theme" }
wm-theme-api = { path = "../wm-theme-api" }
wm-config = { path = "../wm-config" }
cosmic-text = "0.12"
# `SIGTERM` for a dockapp whose socket died while its process did not
# (`spawn::SpawnedChild::terminate`). std has no way to signal a process
# it is not currently holding a `Child` for, and holding one would mean
# owning the `wait` that must stay on its own thread.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# Two wires need JSON. Omarchy's menu definition (`omarchy_menu`) is
# JSONC; order is kept by a hand-written visitor rather than the
# `preserve_order` feature, so the dependency stays the plain one any
# other crate can share. The control socket (`control.rs`) speaks
# newline-framed JSON to third-party bars; the wire is fixed by
# `docs/control-socket.md`, so the serialisation goes through typed
# structs rather than hand-built strings.
serde_json = "1"
tiny-skia = "0.11"
# Decoding Omarchy's background images (`wallpaper::Wallpaper::Omarchy`).
# The built-in artworks are PNGs tiny-skia reads on its own; Omarchy's
# themes ship `.webp` and `.jpg`, and `omarchy theme bg set` accepts
# whatever a user has, so this is the one place the desktop needs a
# real decoder. Pure-Rust codecs only, no rayon: a wallpaper is decoded
# once per change, on the shell's own thread, and the dependency graph
# stays free of C and of a thread pool.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# `.dockapp` registration files. Already a workspace dependency (the
# config, the theme model, and `chonk-ui` all speak it), so a dockapp
# manifest costs nothing new and looks like every other file this
# desktop asks a user to edit.
toml = "0.9"
tracing = "0.1"

[dev-dependencies]
wm-core = { path = "../wm-core", features = ["test-support"] }
