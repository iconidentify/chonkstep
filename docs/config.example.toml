# chonkstep configuration
#
# Location: ~/.config/chonkstep/config.toml
#           ($XDG_CONFIG_HOME/chonkstep/config.toml if that is set)
#
# Every setting here is optional, and the file itself is optional: with
# no file at all, the defaults shown below apply. A broken file never
# prevents the session from starting -- an unreadable or invalid file
# logs a warning and falls back to the defaults, and an individually
# bad line (a typo'd key spec, an unknown action name) is skipped while
# every other line still applies.
#
# Changes apply to a live session without restarting anything: run
# scripts/reload.sh, or bind the "reload" action to a key (see below).
# A reload re-reads this file and applies all of it -- theme, scale,
# focus, placement, edge resistance, terminal font size, and these
# bindings -- keeping every window, client connection and dockapp.
#
# scripts/restart.sh still exists and is a different thing: it re-execs
# the on-disk binary, which is how you pick up a NEW BUILD. Use it after
# rebuilding, not after editing this file. On the X11 session that costs
# nothing visible (windows survive via the SaveSet); on the Wayland
# session it costs you every client, because Wayland clients die with
# the socket they were connected to.

# Focus policy: false (the default) is click-to-focus, true is
# focus-follows-mouse. The CHONKSTEP_FOCUS_FOLLOWS_MOUSE environment
# variable, when set, wins over this value in both directions ("1"
# forces it on, anything else forces it off).
#focus_follows_mouse = false

# UI scale factor for HiDPI displays: multiplies every pixel dimension
# in the window chrome, dock, cursors, and terminal font as one system.
# The CHONKSTEP_SCALE environment variable, when set to a valid value,
# wins over this. Defaults to 1.0 when neither is set. Must be a finite
# number greater than zero; an invalid value falls through to the next
# source rather than breaking startup.
#
# Applied by a reload, live. Two things do not follow, both because
# they are read by other processes at the moment those processes start:
# an application already running keeps the font size and the cursor
# size it was launched with. Anything launched after the reload gets
# the new scale.
#scale = 2.0

# Theme to start in. One of the built-in theme ids:
#   "nextstep-classic" (the flagship default)
#   "amber-phosphor"
#   "teal-blueprint"
#   "graphite"
#   "next-lavender"
#   "jade-lacquer"
#   "ivory-halftone"   (the light one)
#   "indigo-filament"
# A theme picked from the root menu's Themes submenu is persisted and
# wins over this value on every later startup -- the menu is the more
# recent gesture; this line is only the starting point. An unknown id
# is warned about and ignored. Picking one from the menu applies it
# immediately, in place: the chrome, the dock, the menus, the wallpaper
# and every dockapp restyle without the session restarting. Terminals
# already open keep the palette they were launched with.
#theme = "nextstep-classic"

# Where a newly mapped window goes when the application itself asked
# for no particular position (an explicit position, like a terminal's
# -geometry +x+y, is always honored instead). One of:
#   "smart"    (the default) smart placement: scan the usable screen
#              for the spot overlapping the least existing window
#              area, preferring fully free space, biased toward the
#              top-left so windows fill the screen in reading order
#   "cascade"  the classic staircase -- each new window steps down and
#              right by one titlebar, so every titlebar stays visible
#   "center"   every new window dead-center in the usable screen
# Case-insensitive. An unknown value is warned about and "smart" is
# kept.
#placement = "smart"

# Edge resistance for interactive moves, in whole pixels: while a
# window is being dragged, any frame edge that comes within this
# distance of a screen edge or another window's edge snaps flush
# against it, so windows line up without pixel-hunting. Larger values
# grab from farther away; 0 disables snapping entirely. Must be a
# non-negative integer -- anything else is warned about and the
# default of 10 is kept.
#edge_resistance = 10

# Font size of the terminal the desktop spawns, in pixels at 1x scale.
# The UI `scale` above multiplies it, exactly as it multiplies the
# window chrome -- so this is one number for "how big is terminal text"
# regardless of the display it lands on. At the default 20 with
# scale = 2.0 the terminal is set in 40px type.
#
# The launch geometry is derived from it rather than fixed: the window
# is sized as a fraction of the monitor, so raising this trades columns
# for legibility instead of pushing the window off the screen. Colors
# are the active theme's; the font size is not per-theme, since a theme
# restyles the terminal rather than resizing it.
#
# Must be a number between 6 and 96 -- outside that it is warned about
# and the default of 20 is kept.
#terminal_font_px = 20

# Session restore: when true, the desktop records every window's
# application, geometry, workspace and shape (maximized / shaded /
# miniaturized) as you work, and relaunches that layout the next time
# the session starts -- after a logout, and after a crash the watchdog
# recovered from. Windows you closed are forgotten the moment you
# close them; restore never resurrects anything you deliberately
# dismissed. Matching is by application window class, first mapped
# window first, so an application that opens several windows gets them
# back in recorded order. Off by default: a session that spawns
# applications you did not just ask for is something to opt into.
#restore_session = true

# Screen locker for crash recovery, Wayland session only. When the
# compositor crashes, scripts/wayland-session.sh restarts it; if this
# names a locker (any ext-session-lock client, e.g. "swaylock", split
# on whitespace for arguments), the recovered session comes back
# LOCKED instead of exposing your desktop to whoever walks past while
# you are away. Unset, the recovered session comes back unlocked and
# the log says so. This never runs on a normal login or logout.
#lock_command = "swaylock"

# Keybindings. Entries here merge OVER the defaults: listing a combo
# overrides only that combo, and every unlisted default stays bound.
# The special value "none" unbinds a combo outright.
#
# Key spec grammar: case-insensitive, "+"-separated modifier tokens
# followed by exactly one key token, e.g. "alt+shift+return".
#   Modifiers: alt, shift, ctrl (or control), super (or mod4, win)
#   Keys: single letters and digits (a-z, 0-9), return (or enter), tab,
#         space, escape, left, right, up, down, home, end, pageup,
#         pagedown, minus, equal, comma, period, f1 through f12
#
# Actions (kebab-case, a closed set):
#   spawn-terminal, close, toggle-maximize, toggle-shade, miniaturize,
#   toggle-fullscreen, workspace-next, workspace-prev,
#   workspace-carry-next, workspace-carry-prev, overview, reload,
#   restart, none
#
# "reload" re-reads this file and applies it in place; "restart"
# re-execs the on-disk binary to pick up a new build. See the note at
# the top of this file for which one you want.
#
# Window-targeted actions (close, toggle-maximize, toggle-shade,
# miniaturize, toggle-fullscreen) act on the focused window and do
# nothing when no window is focused. The Alt+Tab window switcher is
# part of the window manager's modal machinery and is not rebindable
# here.
[keybindings]
# The full default set, spelled out. Since entries merge over the
# defaults, restating them changes nothing -- edit or remove lines
# freely; unlisted combos keep their default meaning.
"alt+shift+return" = "spawn-terminal"       # launch the themed terminal
"alt+shift+q" = "close"                     # close the focused window
"alt+shift+x" = "toggle-maximize"           # maximize / restore
"alt+shift+s" = "toggle-shade"              # roll the window up into its titlebar
"alt+shift+m" = "miniaturize"               # collapse to an icon tile
"alt+shift+f" = "toggle-fullscreen"         # borderless fullscreen on / off
"alt+ctrl+right" = "workspace-next"         # next workspace (grows on demand)
"alt+ctrl+left" = "workspace-prev"          # previous workspace (stops at the first)
"alt+shift+right" = "workspace-carry-next"  # carry the focused window along
"alt+shift+left" = "workspace-carry-prev"   # carry the focused window back
"super+up" = "overview"                     # the modal Overview (see below)

# "overview" opens a modal view of every window on the current desk as
# a grid of live thumbnails, with a workspace strip along the bottom.
# While it is open the keys are fixed modal machinery, like the Alt+Tab
# switcher's: arrows move the selection, Return (or clicking a tile)
# focuses and raises that window, clicking a workspace tile switches
# desks, and Escape, a second press of this binding, or any other key
# dismisses it.

# Both are unbound by default. Give "reload" a key and this file
# applies itself without you touching a terminal; give "restart" one
# for after a rebuild:
#"super+r" = "reload"
#"super+shift+r" = "restart"

# Unbinding: "none" makes a combo do nothing, without re-listing the
# rest of the defaults. For example, to free alt+shift+q for some other
# application:
#"alt+shift+q" = "none"
