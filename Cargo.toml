[workspace]
resolver = "2"
# `examples/*` holds runnable reference programs that are real
# workspace members rather than `cargo --example` targets: a dockapp is
# a separate *binary* the dock launches, so it has to build, link and
# ship like one. `chonk-dockclock` in particular is a conformance test —
# see its module doc — and it only tests anything if CI builds it.
members = ["crates/*", "examples/*"]
# A dockapp does not have to be Rust — the socket protocol is
# language-agnostic — and `chonk-switch` is Python. Excluded so the
# `examples/*` member glob above doesn't demand a Cargo.toml of it.
# `layer-role-repro` is a Wayland *client*, and the only one in the
# tree: it exists to prove a compositor bug from the outside, so it
# links `wayland-client` — a dependency nothing else here wants, and
# one the workspace should not acquire for a single diagnostic.
# Excluded for that reason rather than for `chonk-switch`'s; see its
# own README for what it reproduces and how to run it.
exclude = ["examples/chonk-switch", "examples/layer-role-repro"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"

# The debug build's startup budget is spent almost entirely inside a
# handful of pure-computation raster and text dependencies, and the
# gap is not a rounding error: painting the wallpaper once at
# 2560x1600 (png decode + tiny-skia bicubic scale) measured ~10.7s
# unoptimized against ~50ms of everything else, which is most of the
# nested-compositor boot the e2e harness pays per test — and the same
# crates dominate every restyle (~11s measured live, see
# chonk-testkit's barrier deadline comments). Building just these
# dependencies optimized keeps our own crates fully debuggable while
# making a debug session behave like a desktop instead of a
# slideshow. Release builds are untouched — this section exists only
# for the dev/test loop.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.cosmic-text]
opt-level = 3
[profile.dev.package.rustybuzz]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.fontdb]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
