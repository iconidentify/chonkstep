[workspace]
resolver = "2"
# `examples/*` holds runnable reference programs that are real
# workspace members rather than `cargo --example` targets: a dockapp is
# a separate *binary* the dock launches, so it has to build, link and
# ship like one. `chonk-dockclock` in particular is a conformance test —
# see its module doc — and it only tests anything if CI builds it.
members = ["crates/*", "examples/*"]
# A dockapp does not have to be Rust — the socket protocol is
# language-agnostic — and `chonk-switch` is Python. Excluded so the
# `examples/*` member glob above doesn't demand a Cargo.toml of it.
exclude = ["examples/chonk-switch"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
